<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ page.title }}</title>
	<link rel="stylesheet" href="../style.css">
	<link rel="alternate" type="application/rss+xml" title="John Vining" href="https://jvining.com/feed.xml">
	{% assign slug = page.path | remove_first: '_notes/' | remove_first: '_reading/' | replace: '.md', '' %}
	<meta property="og:title" content="{{ page.title }}">
	<meta property="og:type" content="article">
	<meta property="og:url" content="https://jvining.com{{ page.url }}">
	<meta property="og:image" content="https://jvining.com/og/{{ slug }}.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:image" content="https://jvining.com/og/{{ slug }}.png">
</head>
<body>

<div class="headernav">
	<h2><a href="https://jvining.com" class="title">John Vining</a></h2>
	<div>
		<a href="../projects.html" class="nav">Projects</a>
		<a href="../contact.html" class="nav">Contact</a>
	</div>
</div>

<div class="articletitle">
	<h3 class="article-date">{{ page.display_date }}</h3>
	<h3 id="{{ page.slug }}">{{ page.title }}</h3>
</div>

{{ content | replace: '<div class="footnotes"', '<hr />
<div class="footnotes"' }}

<script src="../footnote-popover.js"></script>
</body>
</html>
